<text x="550" y="435" text-anchor="middle" font-size="13" fill="#57606a">Open PCAP sends saved packets through the same parser, so detection works on files too.</text>
<text x="550" y="455" text-anchor="middle" font-size="13" fill="#57606a">Save PCAP writes the stored raw packets back to a standard .pcap file.</text>
